<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3 Expressive Dropdown List Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <style>
    /* CSS Variables matching M3 Expressive tokens */
    :root {
      --md-sys-color-primary: #6750A4;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-surface: #FEF7FF;
      --md-sys-color-on-surface: #1D1B20;
      --md-sys-color-on-surface-variant: #49454F;
      --md-sys-color-outline: #79747E;
      --md-sys-color-outline-variant: #CAC4D0;
      --md-sys-color-surface-container-highest: #E6E0E9;
      --md-sys-color-surface-container: #F3EDF7;
      
      --md-sys-shape-corner-extra-small: 4px;
      --md-sys-shape-corner-small: 8px;
      --md-sys-shape-corner-medium: 12px;
      
      --md-sys-elevation-level2: 0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 2px 6px 2px rgba(0, 0, 0, 0.15);
      
      font-family: 'Roboto', sans-serif;
    }

    body {
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      padding: 48px;
      display: flex;
      gap: 32px;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .demo-container {
      display: flex;
      gap: 32px;
    }

    /* ── Dropdown Container (Shared) ── */
    .m3-dropdown-container {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 280px;
    }

    .m3-dropdown-box {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 56px;
      border-radius: var(--md-sys-shape-corner-extra-small);
      cursor: pointer;
      user-select: none;
    }

    .m3-dropdown-value {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      font-size: 1rem;
      line-height: 1.5rem;
      padding: 12px 16px;
      pointer-events: none; /* Let the box handle clicks */
    }

    /* Trailing Dropdown Arrow */
    .m3-dropdown-icon {
      margin-inline-end: 16px;
      color: var(--md-sys-color-on-surface-variant);
      transition: transform 150ms cubic-bezier(0.2, 0, 0, 1);
    }
    
    .m3-dropdown-container.is-open .m3-dropdown-icon {
      transform: rotate(180deg);
    }

    /* Label Styling */
    .m3-dropdown-label {
      position: absolute;
      inset-inline-start: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--md-sys-color-on-surface-variant);
      pointer-events: none;
      transition: all 150ms cubic-bezier(0.2, 0, 0, 1);
      transform-origin: left center;
    }

    /* ── Outlined Variant ── */
    .m3-dropdown-box--outlined {
      border: 1px solid var(--md-sys-color-outline-variant);
      background-color: transparent;
      padding: 0;
    }
    
    .m3-dropdown-box--outlined:hover {
      border-color: var(--md-sys-color-on-surface);
    }
    
    .m3-dropdown-container.is-open .m3-dropdown-box--outlined {
      border: 2px solid var(--md-sys-color-primary);
    }
    
    .m3-dropdown-box--outlined .m3-dropdown-label {
      background-color: var(--md-sys-color-surface);
      padding: 0 4px;
      margin-left: -4px;
    }

    .m3-dropdown-container.has-value .m3-dropdown-label,
    .m3-dropdown-container.is-open .m3-dropdown-label {
      top: 0;
      transform: translateY(-50%) scale(0.75);
      font-weight: 600;
    }

    .m3-dropdown-container.is-open .m3-dropdown-label {
      color: var(--md-sys-color-primary);
    }
    
    /* Outlined padding adjustment */
    .m3-dropdown-container.has-value .m3-dropdown-value {
      padding: 12px 16px;
    }

    /* ── Pop-up Menu (Dropdown List) ── */
    .m3-menu {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      margin-top: 4px;
      background-color: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-extra-small);
      box-shadow: var(--md-sys-elevation-level2);
      z-index: 100;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      
      /* Hidden by default */
      opacity: 0;
      visibility: hidden;
      transform: scaleY(0.8);
      transform-origin: top;
      transition: opacity 150ms ease, transform 150ms cubic-bezier(0.2, 0, 0, 1), visibility 150ms ease;
    }

    .m3-dropdown-container.is-open .m3-menu {
      opacity: 1;
      visibility: visible;
      transform: scaleY(1);
    }

    .m3-menu-item {
      padding: 12px 16px;
      font-size: 1rem;
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background-color 150ms ease;
    }

    .m3-menu-item:hover {
      background-color: rgba(29, 27, 32, 0.08); /* on-surface at 8% opacity */
    }

    .m3-menu-item.is-selected {
      background-color: rgba(103, 80, 164, 0.12); /* primary at 12% opacity */
      color: var(--md-sys-color-primary);
      font-weight: 500;
    }

  </style>
</head>
<body>

  <h1>M3 Expressive Dropdown List Demo</h1>

  <div class="demo-container">

    <!-- Empty Dropdown -->
    <div class="m3-dropdown-container" id="dropdown1">
      <div class="m3-dropdown-box m3-dropdown-box--outlined">
        <label class="m3-dropdown-label">Select skill level</label>
        <div class="m3-dropdown-value"></div>
        <span class="material-symbols-outlined m3-dropdown-icon">arrow_drop_down</span>
      </div>
      
      <div class="m3-menu">
        <div class="m3-menu-item" data-value="Beginner">Beginner</div>
        <div class="m3-menu-item" data-value="Intermediate">Intermediate</div>
        <div class="m3-menu-item" data-value="Advanced">Advanced</div>
        <div class="m3-menu-item" data-value="Expert">Expert</div>
      </div>
    </div>

    <!-- Filled/Selected Dropdown -->
    <div class="m3-dropdown-container has-value" id="dropdown2">
      <div class="m3-dropdown-box m3-dropdown-box--outlined">
        <label class="m3-dropdown-label">Certification type</label>
        <div class="m3-dropdown-value">Professional</div>
        <span class="material-symbols-outlined m3-dropdown-icon">arrow_drop_down</span>
      </div>
      
      <div class="m3-menu">
        <div class="m3-menu-item" data-value="Academic">Academic</div>
        <div class="m3-menu-item is-selected" data-value="Professional">Professional</div>
        <div class="m3-menu-item" data-value="Vocational">Vocational</div>
      </div>
    </div>

  </div>

  <script>
    document.querySelectorAll('.m3-dropdown-container').forEach(container => {
      const box = container.querySelector('.m3-dropdown-box');
      const valueDisplay = container.querySelector('.m3-dropdown-value');
      const items = container.querySelectorAll('.m3-menu-item');

      // Toggle dropdown open/close
      box.addEventListener('click', (e) => {
        e.stopPropagation();
        
        // Close others first
        document.querySelectorAll('.m3-dropdown-container.is-open').forEach(other => {
          if (other !== container) other.classList.remove('is-open');
        });

        container.classList.toggle('is-open');
      });

      // Handle item selection
      items.forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          
          // Update value
          valueDisplay.textContent = item.dataset.value;
          container.classList.add('has-value');
          
          // Update selected state
          items.forEach(i => i.classList.remove('is-selected'));
          item.classList.add('is-selected');

          // Close dropdown
          container.classList.remove('is-open');
        });
      });
    });

    // Close when clicking outside
    document.addEventListener('click', () => {
      document.querySelectorAll('.m3-dropdown-container.is-open').forEach(container => {
        container.classList.remove('is-open');
      });
    });
  </script>

</body>
</html>
