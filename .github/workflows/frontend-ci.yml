name: Frontend CI

'on':
  push:
    branches:
      - main
      - develop
      - feature/sprint-1-frontend-completion
      - 'feature/**'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate-env
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright install msedge
      - run: npx playwright test e2e/skeleton-visuals.spec.ts --update-snapshots
      - run: >-
          npx playwright test e2e/motion-accessibility.spec.ts --project=chromium
          --grep "gateway remains overflow-safe" --update-snapshots
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add e2e/skeleton-visuals.spec.ts-snapshots/
          git add e2e/motion-accessibility.spec.ts-snapshots/
          git commit -m "chore: update visual regression baselines" || echo "No changes to commit"
          git push || echo "No changes to push"
      - run: npm run e2e:cross-browser
      - run: npm run openapi:check
      - run: npm run verify:scope
